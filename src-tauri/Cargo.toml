[package]
name = "luozi"
version = "0.1.0"
description = "Luozi desktop shell"
authors = ["Luozi contributors"]
edition.workspace = true
license.workspace = true

[lib]
name = "luozi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
luozi-core = { path = "../crates/luozi-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { workspace = true }
serde_json = { workspace = true }
cpal = "0.18.1"
hound = "3.5.1"
arboard = "3"
dirs = "6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
whisper-rs = { version = "0.14.2", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }
whisper-rs = { version = "0.14.2", default-features = false }

[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows")))'.dependencies]
whisper-rs = { version = "0.14.2", default-features = false }
