<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>落字 · 语音草稿</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="app-rail" aria-label="主导航">
        <nav class="rail-nav">
          <button type="button" class="rail-item active" data-nav="draft" title="语音草稿" aria-current="page">
            <span class="rail-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </span>
            <span class="rail-label">草稿</span>
          </button>
          <button type="button" class="rail-item" id="btnRailHistory" data-nav="history" title="落字历史">
            <span class="rail-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.8"/></svg>
            </span>
            <span class="rail-label">历史</span>
          </button>
        </nav>
        <div class="rail-spacer"></div>
        <div class="rail-footer">
          <button type="button" class="rail-item" id="btnRailSettings" title="设置">
            <span class="rail-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 5 15.4a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.36.56.96.9 1.51.9H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
            </span>
            <span class="rail-label">设置</span>
          </button>
          <button type="button" class="rail-item" id="btnRailGuide" title="如何使用">
            <span class="rail-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
            </span>
            <span class="rail-label">教程</span>
          </button>
        </div>
      </aside>

      <div class="workbench" id="workbench">
      <header class="wb-toolbar">
        <div class="wb-brand">
          <img class="brand-mark" src="./assets/brand/luozi-mark.svg" width="28" height="28" alt="" />
          <strong id="wbTitle">语音草稿</strong>
        </div>
        <div class="wb-actions" id="draftActions">
          <button type="button" id="btnUndo" title="撤销">撤销</button>
          <button type="button" id="btnRedo" title="重做">重做</button>
          <button type="button" id="btnCopy" class="primary-ghost">复制</button>
          <button type="button" id="btnLoadLast" hidden>载入最近落字</button>
          <button type="button" id="btnClear">清空</button>
        </div>
      </header>

      <main class="wb-body" id="draftPane">
        <textarea
          id="editor"
          spellcheck="true"
          placeholder="说点什么，或直接粘贴"
        ></textarea>
        <p id="saveHint" class="wb-hint" aria-live="polite"></p>
      </main>

      <main class="wb-body history-pane" id="historyPane" hidden>
        <p class="wb-hint history-meta">本机保存，最多 50 条；单条截断以节省空间。</p>
        <div id="historyList" class="history-list" role="list"></div>
        <div id="historyEmpty" class="history-empty" hidden>
          <div class="history-empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.8"/></svg>
          </div>
          <p class="history-empty-title">还没有落字记录</p>
          <p class="history-empty-desc">按住「继续说」热键说几句，转写成功后会出现在这里。可复制或载入到当前草稿。</p>
        </div>
      </main>

      <dialog id="settingsDialog" class="settings-dialog">
        <div class="settings-dialog-bar">
          <strong>设置</strong>
          <button type="button" id="btnCloseSettings" class="settings-dialog-close" aria-label="关闭设置">关闭</button>
        </div>
        <iframe id="settingsFrame" class="settings-frame" title="设置" src="about:blank"></iframe>
      </dialog>

      <footer class="wb-footer">
        <p class="wb-hint" id="draftFooterHint">
          按住 <kbd id="hotkeyHint">Control+Alt+Space</kbd> 继续说；
          按住 <kbd id="editHotkeyHint">Control+Alt+Shift+Space</kbd> 说修改要求。
        </p>
        <p id="status" class="wb-status">就绪</p>
      </footer>
      </div>
    </div>

    <section class="spike-panel" id="spikePanel" hidden>
      <h2>开发 Spike</h2>
      <p>仅 URL 带 <code>?spike</code> 时显示。</p>
      <div id="spikeMount"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
