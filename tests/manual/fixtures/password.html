<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Luozi M0 Secure Field</title>
    <style>
      body {
        margin: 80px;
        font-family: system-ui, sans-serif;
      }
      input {
        font-size: 24px;
        padding: 12px;
        width: 320px;
      }
    </style>

    <label for="p">Password probe</label>
    <input id="p" type="password" name="password" autocomplete="off" />

      el.focus();
      setInterval(() => el.focus(), 200);
    </script>
