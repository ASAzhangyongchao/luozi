<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luozi</title>
  </head>
  <body>
    <main class="container">
      <h1>落字 · Luozi</h1>
      <p id="status">练习窗 · M1 骨架</p>

      <section class="card" id="aboutCard" hidden>
        <h2>关于</h2>
        <pre id="aboutText"></pre>
        <button id="closeAbout" type="button">关闭</button>
      </section>

      <section class="card">
        <h2>练习</h2>
        <p>当前快捷键为 provisional（Mac-first Partial，未正式定稿）。</p>
        <ul id="shortcutList"></ul>
        <p>关闭窗口会隐藏到托盘；从托盘「退出」才结束进程。</p>
      </section>

      <section class="card" id="spikeCard" hidden>
        <h2>M0 Spike（开发）</h2>
        <p>仅在设置 <code>LUOZI_M0_SPIKE=1</code> 时显示，避免误触写入。</p>
        <label for="shortcut">Candidate</label>
        <select id="shortcut">
          <option>Control+Alt+Space</option>
          <option>Control+Shift+Space</option>
          <option>Control+Alt+M</option>
          <option>Control+Shift+M</option>
        </select>
        <div class="actions">
          <button id="register" type="button">Register</button>
          <button id="clear" type="button">Unregister all</button>
          <button id="autoFocus" type="button">自动测焦点</button>
          <button id="audioProbe" type="button">测麦克风 1s</button>
          <button id="showOverlay" type="button">显示悬浮条</button>
          <button id="hideOverlay" type="button">隐藏悬浮条</button>
        </div>
        <pre id="events" aria-live="polite"></pre>
        <pre id="focusReport" aria-live="polite"></pre>
        <pre id="deliveryReport" aria-live="polite"></pre>
        <pre id="audioReport" aria-live="polite"></pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
